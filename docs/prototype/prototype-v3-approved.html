<title>Renuga Novels Prototype</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+Tamil:wght@400;500;600;700&family=Noto+Serif+Tamil:wght@500;600;700&family=Hind+Madurai:wght@400;500;600&display=swap">
<style>
/* Layout: one sticky top bar with a hamburger menu at every width, then a centred content column. One responsive page for Home, Ongoing, Completed, Story, Account. */
:root{
  --bg:#F0F8F7; --paper:#FFFFFF; --band:#DCEFED; --text:#12302F; --muted:#476462;
  --border:#D0E4E2; --btn:#AFCFCC; --primary:#0A6F6D; --on-primary:#FFFFFF;
  --rose:#A9432F; --on-rose:#FFFFFF; --rose-chip:#FCE5DF; --chip:#CDE9E6;
  --star:#E2A02B; --star-stroke:#8E5F0B; --hl-hint:#7FA3A0;
  --hl-yellow:#FBE7A0; --hl-green:#CFEBD3; --hl-pink:#F8D2D6;
  --sans:'Noto Sans Tamil','Hind Madurai','Latha',system-ui,sans-serif;
  --serif:'Noto Serif Tamil','Noto Sans Tamil','Hind Madurai','Latha',serif;
  --gutter-l:max(16px, env(safe-area-inset-left, 0px));
  --gutter-r:max(16px, env(safe-area-inset-right, 0px));
}
/* Day / night reading mode only changes the tokens */
:root[data-mode="night"]{
  --bg:#0E1F1F; --paper:#152929; --band:#1B3232; --text:#E4F3F1; --muted:#A8C7C4;
  --border:#2A4644; --btn:#3B5E5B; --primary:#6ED3CD; --on-primary:#07211F;
  --rose:#F4A593; --on-rose:#3A120A; --rose-chip:#3A2420; --chip:#213F3D;
  --star:#E7B35C; --star-stroke:#E7B35C; --hl-hint:#6F9490;
  --hl-yellow:#6B5A1F; --hl-green:#2F5236; --hl-pink:#6A3840;
}
*{box-sizing:border-box}
html{scroll-behavior:smooth}
body{margin:0;background:var(--bg);color:var(--text);font-family:var(--sans);font-size:16px;line-height:1.7;-webkit-text-size-adjust:100%}
a{color:var(--primary);text-decoration:none}
button{font-family:inherit;color:inherit}
a:focus-visible,button:focus-visible,textarea:focus-visible,input:focus-visible{outline:3px solid var(--rose);outline-offset:2px}
h1,h2,h3{font-family:var(--sans);margin:0}
svg{flex:none}
.ic{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round}
.ic.s{width:15px;height:15px}
.star{width:1em;height:1em;fill:var(--star);stroke:var(--star-stroke);stroke-width:1.5;stroke-linejoin:round}
.muted{color:var(--muted)}
.row{display:flex;align-items:center}

/* shell */
.shell{display:flex;align-items:flex-start;min-height:100vh}
.main{flex:1;min-width:0}
.dtop{display:none}
.mtop{position:sticky;top:env(safe-area-inset-top,0px);z-index:30;background:var(--paper);border-bottom:1px solid var(--border);padding:6px var(--gutter-r) 6px var(--gutter-l);display:flex;align-items:center;justify-content:space-between;gap:8px}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:60;background:var(--paper)}
.chips{display:flex;gap:8px;overflow-x:auto;padding:12px var(--gutter-r) 12px var(--gutter-l);scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{flex:none;min-height:44px;padding:0 18px;border-radius:999px;display:flex;align-items:center;font-size:14px;font-weight:600;background:var(--paper);color:var(--text);border:1px solid var(--btn);cursor:pointer}
.chip.on{background:var(--primary);color:var(--on-primary);border-color:var(--primary)}
.wrap{padding:8px var(--gutter-r) 32px var(--gutter-l);display:flex;flex-direction:column;gap:32px;width:100%;max-width:1280px;margin:0 auto}
.logo{display:flex;align-items:center;gap:10px;color:var(--text);min-width:0;cursor:pointer;background:none;border:none;padding:0}
.logo b{font-size:18px;white-space:nowrap}
.iconbtn{width:44px;height:44px;border-radius:999px;border:1px solid var(--btn);background:var(--paper);color:var(--text);display:flex;align-items:center;justify-content:center;cursor:pointer;padding:0;position:relative}
.iconbtn.fill{background:var(--primary);color:var(--on-primary);border-color:var(--primary)}
.dot{position:absolute;top:8px;right:9px;width:10px;height:10px;border-radius:999px;background:var(--rose);border:2px solid var(--paper)}
.btn{min-height:48px;padding:0 24px;border-radius:999px;border:2px solid var(--primary);background:var(--primary);color:var(--on-primary);font-weight:600;font-size:15px;display:inline-flex;align-items:center;justify-content:center;gap:8px;cursor:pointer}
.btn.ghost{background:transparent;color:var(--primary)}
.btn.sq{border-radius:14px}
.pill{display:inline-block;background:var(--rose-chip);color:var(--rose);font-size:13px;font-weight:600;padding:1px 14px;border-radius:999px}
.pill.solid{background:var(--rose);color:var(--on-rose);font-size:12px;padding:0 12px;line-height:1.9}
.pill.teal{background:var(--chip);color:var(--text)}
.card{background:var(--paper);border:1px solid var(--border);border-radius:22px}
.sec h2{font-size:26px;line-height:1.5;font-weight:700}
.sec .sub{font-size:14px;color:var(--muted)}
.sec{display:flex;flex-direction:column;gap:16px}
.cover{display:block;border-radius:12px;box-shadow:0 6px 14px rgba(18,48,47,.18)}
.meta{display:flex;flex-wrap:wrap;gap:4px 14px;font-size:13px;color:var(--muted);align-items:center}
.meta span{display:flex;align-items:center;gap:5px}
.tt{font-weight:700;font-size:19px;line-height:1.5}

/* hero */
.hero{padding:22px;display:grid;gap:22px;grid-template-columns:minmax(0,1fr);border-radius:28px}
.hero h1{font-size:30px;line-height:1.4;font-weight:700}
.hero p{margin:0;font-size:16px;color:var(--muted)}
.heroart{border-radius:22px;overflow:hidden;line-height:0}
.stats{display:flex;gap:28px;flex-wrap:wrap}
.stats div{display:flex;flex-direction:column;line-height:1.4;font-size:13px;color:var(--muted)}
.stats b{font-size:24px;color:var(--primary)}

/* trending */
.trend{display:flex;align-items:center;gap:14px;padding:14px 0;border-bottom:1px solid var(--border);color:var(--text);cursor:pointer;background:none;border-left:none;border-right:none;border-top:none;width:100%;text-align:left;font-size:16px}
.trend:last-child{border-bottom:none}
.trend .rank{width:30px;text-align:center;font-size:28px;font-weight:700;color:var(--primary);line-height:1}
.trend .t{flex:1;min-width:0;display:flex;flex-direction:column}
.trend .rd{display:none;min-height:44px;padding:0 18px;border-radius:12px;background:var(--chip);color:var(--text);font-weight:600;font-size:14px;align-items:center}
.grid4{display:grid;gap:16px;grid-template-columns:minmax(0,1fr)}
.ongoing{padding:16px;display:flex;flex-direction:column;gap:10px;border-radius:24px}
.ongoing .cv{width:100%;height:auto;border-radius:16px;box-shadow:none}
.snip{margin:0;font-size:14px;color:var(--muted);line-height:1.8;display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}
.completed{background:var(--band);border-radius:28px;padding:20px}
.cgrid{display:grid;gap:14px;grid-template-columns:minmax(0,1fr)}
.cpl{background:var(--paper);border-radius:22px;padding:14px;display:flex;gap:16px;align-items:center;cursor:pointer;border:none;text-align:left;width:100%;color:var(--text)}
.upd{display:flex;align-items:center;gap:14px;padding:14px 18px;border:none;border-bottom:1px solid var(--border);background:none;width:100%;text-align:left;color:var(--text);cursor:pointer;flex-wrap:wrap}
.upd:last-child{border-bottom:none}
.upd .d{font-size:13px;color:var(--muted);display:flex;align-items:center;gap:6px;flex-basis:100%}
.upd .n{flex:1;min-width:0;font-weight:600;font-size:16px;line-height:1.6}
.notify{background:var(--primary);color:var(--on-primary);border-radius:24px;padding:22px;display:flex;flex-direction:column;gap:10px;align-items:flex-start}
.notify h3{font-size:20px;line-height:1.5;color:var(--on-primary)}
.notify p{margin:0;font-size:15px;line-height:1.8;opacity:.95}
.notify .btn{background:#fff;color:#0B5F5E;border-color:#fff}
footer{background:var(--paper);border-top:1px solid var(--border);padding:28px var(--gutter-r) 32px var(--gutter-l);display:flex;flex-direction:column;gap:12px;margin-top:16px}
footer nav{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));font-size:14px}
footer nav a{color:var(--text);min-height:44px;display:flex;align-items:center}
.authorcard{padding:22px;display:flex;flex-direction:column;gap:10px}

/* story */
.sbar{position:fixed;left:0;right:0;top:env(safe-area-inset-top,0px);height:5px;background:var(--border);z-index:50}
.sbar i{display:block;height:5px;background:var(--primary);width:0;transition:width 120ms}
.band{background:var(--band);border-radius:22px;padding:20px;display:flex;flex-direction:column;gap:8px;align-items:flex-start}
.band h1{font-size:26px;line-height:1.45}
.paper{background:var(--paper);border:1px solid var(--border);border-radius:20px;padding:22px 18px 32px;min-width:0}
article{font-family:var(--serif);margin:0 auto;max-width:640px;line-height:2}
article p{margin:0 0 1.15em}
article .q{text-align:center;font-weight:600;padding:4px 12px;color:var(--rose)}
.s{border-radius:4px;padding:2px 0;-webkit-box-decoration-break:clone;box-decoration-break:clone}
.s.hl-y{background:var(--hl-yellow)}.s.hl-g{background:var(--hl-green)}.s.hl-p{background:var(--hl-pink)}
.s.tap{cursor:pointer;text-decoration:underline dotted var(--hl-hint);text-underline-offset:8px}
.tools{position:fixed;left:50%;bottom:calc(env(safe-area-inset-bottom,0px) + 16px);transform:translateX(-50%);z-index:40;display:flex;flex-direction:column-reverse;align-items:center;gap:8px;width:max-content;max-width:calc(100vw - 24px);transition:opacity 250ms,transform 250ms,visibility 250ms}
.tools.off{opacity:0;visibility:hidden;transform:translate(-50%,16px)}
.toolbar{display:flex;align-items:center;gap:4px;padding:6px;border-radius:999px;background:var(--paper);border:1px solid var(--border);box-shadow:0 8px 24px rgba(10,50,48,.22)}
.tb{min-width:44px;height:44px;border-radius:999px;border:none;background:var(--chip);color:var(--text);font-weight:700;font-size:14px;display:flex;align-items:center;justify-content:center;cursor:pointer;padding:0}
.tb[disabled]{opacity:.4;cursor:not-allowed}
.tb.on{background:var(--primary);color:var(--on-primary)}
.tools .sz{min-width:46px;text-align:center;font-weight:700;font-size:14px}
.pop{width:min(340px,calc(100vw - 24px));background:var(--paper);border:1px solid var(--border);border-radius:20px;padding:12px 8px 12px 16px;display:flex;flex-direction:column;gap:6px;box-shadow:0 8px 24px rgba(10,50,48,.22);font-size:14px}
.pop.rose{background:var(--rose-chip)}
.sw{width:44px;height:44px;border:none;background:transparent;display:flex;align-items:center;justify-content:center;cursor:pointer;padding:0}
.sw i{width:26px;height:26px;border-radius:999px;border:2px solid var(--btn);display:block}
.sw.on i{box-shadow:0 0 0 3px var(--text)}
.nav2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.nav2 .full{grid-column:span 2}
.rate{background:var(--band);border-radius:22px;padding:26px 20px;display:flex;flex-direction:column;align-items:center;gap:6px;text-align:center}
.stars{display:flex;gap:2px}
.stars button{width:52px;height:52px;border:none;background:transparent;display:flex;align-items:center;justify-content:center;cursor:pointer;padding:0}
.stars svg{width:36px;height:36px}
.hlrow{display:flex;gap:10px;align-items:flex-start;padding:8px 8px 8px 14px;border-radius:18px;background:var(--band)}
.hlrow .d{width:12px;height:12px;border-radius:999px;margin-top:10px}
.xbtn{width:44px;height:44px;margin:-4px 0;border-radius:999px;border:none;background:transparent;color:var(--muted);display:flex;align-items:center;justify-content:center;cursor:pointer;flex:none}
.cbox{display:flex;gap:10px;align-items:flex-end;background:var(--paper);border:1px solid var(--btn);border-radius:18px;padding:8px 8px 8px 18px}
.cbox textarea{flex:1;min-width:0;border:none;outline:none;background:transparent;resize:none;font-family:inherit;font-size:16px;line-height:1.7;color:var(--text);padding:6px 0}
.send{width:48px;height:48px;flex:none;border-radius:999px;border:none;background:var(--primary);color:var(--on-primary);display:flex;align-items:center;justify-content:center;cursor:pointer;padding:0}
.cm{display:flex;gap:10px;align-items:flex-start}
.av{width:40px;height:40px;border-radius:999px;background:var(--chip);color:var(--text);display:flex;align-items:center;justify-content:center;font-weight:700;flex:none}
.av.au{background:var(--rose);color:var(--on-rose)}
.av.me{background:#F6DFA6;color:#4A3508}
.av.sm{width:34px;height:34px;font-size:14px}
.bub{background:var(--band);border-radius:4px 16px 16px 16px;padding:12px 18px;max-width:100%}
.bub.rp{background:var(--paper);border:1px solid var(--border);padding:10px 16px}
.bub .h{display:flex;flex-wrap:wrap;align-items:center;gap:2px 10px}
.bub .h b{font-size:15px}
.bub .h small{font-size:12px;color:var(--muted)}
.bub p{margin:0;line-height:1.85}
.replybtn{min-height:44px;padding:0 6px 0 14px;border:none;background:transparent;color:var(--primary);font-weight:600;font-size:14px;display:flex;align-items:center;gap:6px;cursor:pointer}
.thread{margin-left:19px;padding-left:18px;border-left:3px solid var(--btn);display:flex;flex-direction:column;gap:12px}
.toast{position:fixed;left:50%;bottom:calc(env(safe-area-inset-bottom,0px) + 20px);transform:translateX(-50%);background:var(--text);color:var(--bg);padding:12px 20px;border-radius:999px;font-size:14px;z-index:80;max-width:calc(100vw - 32px);text-align:center}

/* account */
.acc{padding:20px;display:flex;gap:18px;align-items:center;flex-wrap:wrap}
.tabs{display:flex;gap:8px;overflow-x:auto;scrollbar-width:none;padding-bottom:2px}
.tab{min-height:48px;padding:0 18px;border-radius:999px;border:1px solid var(--btn);background:var(--paper);color:var(--text);font-weight:600;font-size:15px;cursor:pointer;display:flex;align-items:center;gap:8px;flex:none}
.tab.on{background:var(--primary);color:var(--on-primary);border-color:var(--primary)}
.tab em{font-style:normal;min-width:24px;padding:0 8px;border-radius:999px;background:var(--chip);color:var(--text);font-size:13px;line-height:1.8}
.tab.on em{background:rgba(255,255,255,.28);color:var(--on-primary)}
.bm{padding:16px;display:flex;flex-direction:column;gap:14px}
.prog{height:8px;border-radius:999px;background:var(--border);overflow:hidden}
.prog i{display:block;height:8px;background:var(--primary)}
.tgl{width:56px;height:48px;border:none;background:transparent;padding:0;cursor:pointer;display:flex;align-items:center;justify-content:center;flex:none}
.tgl span{width:52px;height:30px;border-radius:999px;background:var(--btn);position:relative;display:block;transition:background 150ms}
.tgl span::after{content:"";position:absolute;top:3px;left:3px;width:24px;height:24px;border-radius:999px;background:#fff;box-shadow:0 1px 3px rgba(0,0,0,.3);transition:transform 150ms}
.tgl[aria-checked="true"] span{background:var(--primary)}
.tgl[aria-checked="true"] span::after{transform:translateX(22px)}
.field{display:flex;flex-direction:column;gap:4px;font-size:14px;font-weight:600}
.field input{min-height:48px;border-radius:12px;border:1px solid var(--btn);background:var(--bg);color:var(--text);font-family:inherit;font-size:16px;padding:0 14px}
.empty{padding:32px;text-align:center;color:var(--muted)}

/* modal + bell popover */
.scrim{position:fixed;inset:0;background:rgba(10,40,38,.45);z-index:70;display:flex;align-items:center;justify-content:center;padding:16px}
.modal{background:var(--paper);border-radius:24px;padding:26px;max-width:400px;width:100%;display:flex;flex-direction:column;gap:12px;box-shadow:0 20px 50px rgba(0,0,0,.3)}
.bell{position:fixed;z-index:65;right:max(12px,env(safe-area-inset-right,0px));top:calc(env(safe-area-inset-top,0px) + 62px);width:min(360px,calc(100vw - 24px));background:var(--paper);border:1px solid var(--border);border-radius:20px;box-shadow:0 12px 32px rgba(10,50,48,.25);overflow:hidden}
.bell .it{padding:12px 18px;border-bottom:1px solid var(--border);display:flex;flex-direction:column;gap:2px;cursor:pointer;background:none;border-left:none;border-right:none;border-top:none;text-align:left;width:100%;color:var(--text)}
.bell .it small{color:var(--muted);font-size:12px}

.nocopy{-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}
@media print{#chapter{display:none!important}}
.brand{display:flex;align-items:center;gap:10px;color:var(--text);min-width:0;cursor:pointer;background:none;border:none;padding:0;text-align:left}
.brand img{border-radius:999px;display:block;flex:none}
.brand .nm{display:flex;flex-direction:column;line-height:1.25;min-width:0}
.brand .nm b{font-weight:700;white-space:nowrap}
.brand .nm small{letter-spacing:.2em;text-transform:uppercase;color:var(--muted);font-weight:500}
.logohero{background:var(--band);border-radius:22px;padding:28px;display:flex;align-items:center;justify-content:center}
.logohero img{width:min(300px,100%);height:auto;border-radius:999px;box-shadow:0 14px 34px rgba(11,95,94,.28);display:block}
.cont{padding:18px 20px;display:flex;gap:16px;align-items:center;flex-wrap:wrap;border-radius:24px;background:var(--band)}
.cont .prog{background:var(--btn);max-width:360px;margin-top:6px}
.resume{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(env(safe-area-inset-bottom,0px) + 100px);z-index:45;width:min(440px,calc(100vw - 24px));background:var(--paper);border:1px solid var(--btn);border-radius:20px;padding:14px 8px 14px 18px;box-shadow:0 10px 30px rgba(10,50,48,.28);display:flex;flex-direction:column;gap:10px}
.toast.hi{bottom:calc(env(safe-area-inset-bottom,0px) + 96px)}
@media (min-width:720px){
  .hero{grid-template-columns:minmax(0,1.05fr) minmax(0,1fr);align-items:center;padding:32px;gap:32px}
  .hero h1{font-size:38px}
  .grid4{grid-template-columns:repeat(2,minmax(0,1fr))}
  .cgrid{grid-template-columns:repeat(2,minmax(0,1fr))}
  .upd .d{flex-basis:auto;width:150px}
  .trend .rd{display:flex}
  .nav2{grid-template-columns:repeat(3,minmax(0,1fr))}
  .nav2 .full{grid-column:auto}
}
@media (min-width:1024px){
  .mtop,.chips{display:none}
  .dtop{display:flex;align-items:center;justify-content:space-between;gap:24px;padding:20px 48px;border-bottom:1px solid var(--border);background:var(--paper);position:sticky;top:0;z-index:30}
  .wrap{padding:36px 48px 0;gap:56px}
  .acc-wrap,.wrap.story{padding-top:28px}
  .bell{top:76px;right:48px}
  .resume{bottom:100px}
  .grid4{grid-template-columns:repeat(4,minmax(0,1fr))}
  .cgrid{grid-template-columns:repeat(3,minmax(0,1fr))}
  .twocol{display:grid;grid-template-columns:minmax(0,1.75fr) minmax(0,1fr);gap:32px;align-items:start}
  .twocol aside{position:sticky;top:96px}
  footer{padding:36px 48px 28px}
  footer nav{display:flex;gap:28px}
  .story-inner{max-width:880px;width:100%;margin:0 auto;display:flex;flex-direction:column;gap:28px}
  .paper{padding:36px 56px 48px}
  .hero h1{font-size:44px}
  .sec h2{font-size:30px}
  .accgrid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:16px;align-items:start}
  .bmgrid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:16px}
  .mhide{display:none}
}
@media (max-width:1023px){.dhide{display:none}}
@media (prefers-reduced-motion:reduce){*{transition:none!important;scroll-behavior:auto!important}}
/* hamburger drawer */
.mscrim{position:fixed;inset:0;background:rgba(10,40,38,.45);z-index:70}
.drawer{position:absolute;left:0;top:0;bottom:0;width:min(340px,88vw);background:var(--paper);display:flex;flex-direction:column;gap:20px;overflow-y:auto;padding-top:calc(env(safe-area-inset-top,0px) + 16px);padding-bottom:calc(env(safe-area-inset-bottom,0px) + 16px);padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:16px;box-shadow:8px 0 30px rgba(10,50,48,.25)}
.mtop .brand{flex:1 1 auto;min-width:0}
.mtop .brand .nm{min-width:0;overflow:hidden}
.mtop .brand .nm b{font-size:15px;overflow:hidden;text-overflow:ellipsis}
@media (max-width:399px){.mtop .brand .nm b{font-size:14px}}
/* page titles, tagline, view-more rows */
.ptitle{font-size:30px;line-height:1.4;font-weight:700;margin:0}
.hero p.tag{font-size:20px;font-weight:600;color:var(--text)}
.trend-more{width:100%;min-height:48px;border:none;border-top:1px solid var(--border);background:none;color:var(--primary);font-weight:600;font-size:15px;display:flex;align-items:center;justify-content:center;gap:8px;cursor:pointer;padding:0}
.grid4.one{grid-template-columns:minmax(0,1fr)}
.cgrid.one{grid-template-columns:minmax(0,560px)}
.ongoing.feat .ft{display:flex;flex-direction:column;gap:10px;min-width:0}
.ongoing.feat .btn{align-self:flex-start;min-width:200px}
@media (min-width:720px){
  .ongoing.feat{flex-direction:row;align-items:center;gap:28px;padding:20px;max-width:780px}
  .ongoing.feat .cv{width:200px;flex:none}
  .ongoing.feat .ft{flex:1}
}
@media (min-width:1024px){.ptitle{font-size:36px}}
/* author update form */
.field textarea{min-height:96px;border-radius:12px;border:1px solid var(--btn);background:var(--bg);color:var(--text);font-family:inherit;font-size:16px;line-height:1.7;padding:12px 14px;resize:vertical}

</style>

function drawTools(){$('#toolsHost').innerHTML=S.view==='story'?toolsHtml():''}
function bumpTools(){
  if(S.view!=='story')return;
  var el=$('#tools');
  if(!S.toolsOn){S.toolsOn=true;if(el)el.classList.remove('off')}
  clearTimeout(bumpTools.t);
  bumpTools.t=setTimeout(function(){
    if(S.hlMode||S.notice)return;
    S.toolsOn=false;var e=$('#tools');if(e)e.classList.add('off');
  },2000);
}

/* ---------- ACCOUNT ---------- */
function accountHtml(){
  var bms=BOOKMARKS.filter(function(b){return !S.removed[b.id]});
  var tabs=[['bookmarks','Bookmarks',bms.length],['history','Reading history',HISTORY.length],['highlights','My highlights',SAVEDHL.length],['settings','Settings',null]];
  var body='';
  if(S.tab==='bookmarks'){
    body='<p class="muted" style="margin:0;font-size:14px;display:flex;align-items:center;gap:6px">'+I(P.lock,'s')+'<span>Only you can see your bookmarks.</span></p>'
     +(bms.length?'':'<div class="card empty">No bookmarks yet. Tap the bookmark button while reading to save a chapter here.</div>')
     +'<div class="bmgrid" style="display:grid;gap:16px">'+bms.map(function(b){var s=byId(b.s);
       return '<div class="card bm"><div class="row" style="gap:16px;align-items:flex-start">'+cover(s.p,64,91)+'<div style="flex:1;min-width:0;display:flex;flex-direction:column;gap:6px;align-items:flex-start"><span lang="ta" class="tt">'+s.t+'</span><span class="pill" style="font-size:13px;padding:0 12px;line-height:1.9">'+b.ch+'</span><span class="muted" style="font-size:13px;display:flex;align-items:center;gap:6px">'+I(P.clock,'s')+'Saved '+b.saved+'</span></div></div><div><div class="prog"><i style="width:'+b.pct+'%"></i></div><span class="muted" style="font-size:13px">'+b.pct+'% read</span></div><div class="row" style="gap:10px"><button class="btn" style="flex:1" data-story="'+s.id+'"><span>Continue reading</span>'+I(P.arrow,'s')+'</button><button class="iconbtn" style="width:48px;height:48px" data-unbm="'+b.id+'" aria-label="Remove bookmark">'+I(P.trash)+'</button></div></div>'}).join('')+'</div>';
  }else if(S.tab==='history'){
    body='<section class="card" style="padding:6px 20px;display:flex;flex-direction:column">'+HISTORY.map(function(h0,hi){var h=hi===0?['s1','Chapter '+S.last.ch,S.last.at,S.last.pct]:h0;var s=byId(h[0]);
      return '<button data-story="'+s.id+'" style="display:flex;gap:14px;align-items:center;padding:14px 0;border:none;border-bottom:1px solid var(--border);background:none;color:var(--text);text-align:left;cursor:pointer;width:100%">'+cover(s.p,44,62)+'<span style="flex:1;min-width:0;display:flex;flex-direction:column;gap:4px"><span lang="ta" style="font-weight:700;font-size:17px;line-height:1.5">'+s.t+' · '+h[1]+'</span><span class="muted" style="font-size:13px;display:flex;align-items:center;gap:6px">'+I(P.clock,'s')+'Last read '+h[2]+'</span><span class="row" style="gap:10px"><span style="flex:1;height:6px;border-radius:999px;background:var(--border);overflow:hidden"><span style="display:block;height:6px;width:'+h[3]+'%;background:var(--primary)"></span></span><span class="muted" style="font-size:13px">'+h[3]+'%</span></span></span></button>'}).join('')+'</section>';
  }else if(S.tab==='highlights'){
    body='<p class="muted" style="margin:0;font-size:14px;display:flex;align-items:center;gap:6px">'+I(P.lock,'s')+'<span>Only you can see your highlights.</span></p><div class="accgrid" style="display:grid;gap:16px">'+SAVEDHL.map(function(h){var s=byId(h[1]);
      return '<div class="card" style="padding:18px 20px;display:flex;gap:14px;align-items:flex-start"><span aria-hidden="true" style="width:14px;height:14px;border-radius:999px;background:'+HLDOT[h[4]]+';margin-top:9px;flex:none"></span><div style="flex:1;min-width:0;display:flex;flex-direction:column;gap:6px"><p lang="ta" class="nocopy" style="margin:0;font-size:17px;line-height:1.9;background:'+HLCSS[h[4]]+';padding:2px 8px;border-radius:8px;align-self:flex-start;color:var(--text)">'+h[0]+'</p><span lang="ta" class="muted" style="font-size:13px">'+s.t+' · '+h[2]+' · '+h[3]+'</span><button data-story="'+s.id+'" style="min-height:44px;display:flex;align-items:center;gap:6px;font-weight:600;font-size:14px;color:var(--primary);background:none;border:none;cursor:pointer;padding:0"><span>Open in chapter</span>'+I(P.arrow,'s')+'</button></div></div>'}).join('')+'</div>';
  }else{
    function tg(k,l,h){return '<div class="row" style="gap:14px;padding:12px 0;border-top:1px solid var(--border)"><span style="flex:1;min-width:0;display:flex;flex-direction:column;line-height:1.5"><span style="font-weight:600">'+l+'</span><span class="muted" style="font-size:13px">'+h+'</span></span><button class="tgl" role="switch" aria-checked="'+S[k]+'" aria-label="'+l+'" data-tg="'+k+'"><span></span></button></div>'}
    body='<div class="accgrid" style="display:grid;gap:16px"><div class="card" style="padding:22px;display:flex;flex-direction:column;gap:4px"><h2 style="font-size:20px;line-height:1.5;margin-bottom:6px">Notifications</h2>'+tg('push','New chapter alerts','Browser notification when a new story or chapter is published')+tg('mailReply','Replies to my comments','Email me when someone replies')+tg('mailNew','Weekly digest','A short email with the week’s new chapters')+'<p class="muted" style="margin:6px 0 0;font-size:13px">Browser notifications need your permission, and you can turn them off at any time.</p></div>'
     +'<div class="card" style="padding:22px;display:flex;flex-direction:column;gap:12px"><h2 style="font-size:20px;line-height:1.5">My details</h2><label class="field" for="dn">Display name<input id="dn" type="text" value="Kavitha S"></label><label class="field" for="em">Email<input id="em" type="email" value="kavitha@example.com"></label><div class="row" style="gap:10px;flex-wrap:wrap;padding-top:4px"><button class="btn" data-act="save">Save changes</button><button style="min-height:48px;padding:0 20px;border-radius:999px;color:var(--rose);font-weight:600;font-size:15px;background:none;border:none;cursor:pointer" data-act="delacc">Delete my account</button></div></div></div>';
  }
  return '<div class="wrap acc-wrap"><div style="display:flex;flex-direction:column;gap:22px">'
   +'<section class="card acc" aria-labelledby="acc-h"><span aria-hidden="true" style="width:64px;height:64px;border-radius:999px;background:var(--primary);color:var(--on-primary);display:flex;align-items:center;justify-content:center;font-size:28px;font-weight:700;flex:none">K</span><div style="flex:1;min-width:160px;display:flex;flex-direction:column"><h1 id="acc-h" style="font-size:24px;line-height:1.4">Kavitha S</h1><span class="muted" style="font-size:15px">kavitha@example.com</span><span class="muted" style="font-size:13px">Member since 12-Sep-26 10:15</span></div><div class="row" style="gap:22px">'
   +[[bms.length,'Bookmarks'],['38','Chapters read'],['6','Comments']].map(function(x){return '<span style="display:flex;flex-direction:column;align-items:center;line-height:1.4"><b style="font-size:24px;color:var(--primary)">'+x[0]+'</b><span class="muted" style="font-size:13px">'+x[1]+'</span></span>'}).join('')
   +'</div><button class="btn ghost" data-act="logout">'+I(P.out,'s')+'<span>Log out</span></button></section>'
   +'<div class="tabs" role="tablist" aria-label="Account sections">'+tabs.map(function(t){return '<button class="tab'+(S.tab===t[0]?' on':'')+'" role="tab" aria-selected="'+(S.tab===t[0])+'" data-tab="'+t[0]+'"><span>'+t[1]+'</span>'+(t[2]!==null?'<em>'+t[2]+'</em>':'')+'</button>'}).join('')+'</div>'
   +'<div style="display:flex;flex-direction:column;gap:14px">'+body+'</div></div></div>'+footerHtml();
}

/* ---------- overlays ---------- */
function overlayHtml(){
  var o='';
  if(S.menu)o+=drawerHtml();
  if(S.bell)o+='<div class="bell" role="dialog" aria-label="Notifications"><div style="padding:14px 18px;border-bottom:1px solid var(--border);font-weight:700">Notifications</div>'
   +[['New: மழைத்துளி மனதோரம் – Chapter 12','24-Oct-26 09:30','s1'],['New: நிலாச்சோறு நினைவுகள் – Chapter 8','23-Oct-26 18:15','s2'],['Renuga replied to your comment','24-Oct-26 22:05','s1']].map(function(n){return '<button class="it" data-story="'+n[2]+'"><span lang="ta" style="font-weight:600;font-size:15px">'+n[0]+'</span><small>'+n[1]+'</small></button>'}).join('')
   +'<div style="padding:12px 18px;display:flex;flex-direction:column;gap:8px;align-items:flex-start"><span class="muted" style="font-size:13px">Get a browser notification for every new chapter.</span><button class="btn" style="min-height:44px;padding:0 20px;font-size:14px" data-act="pushon">'+(S.push?'Notifications on':'Turn on notifications')+'</button></div></div>';
  if(S.view==='story'&&S.resumeBar)o+='<div class="resume" role="dialog" aria-label="Resume reading"><div class="row" style="align-items:flex-start;gap:6px"><span style="flex:1;font-size:14px;padding-top:2px"><b>Welcome back.</b> You stopped at paragraph '+(S.last.para+1)+' of '+PARAS.length+' ('+S.last.pct+'% read) on '+S.last.at+'.</span><button class="xbtn" data-act="startover" aria-label="Dismiss" style="margin:-8px 0 0">'+I(P.x,'s')+'</button></div><div class="row" style="gap:8px;flex-wrap:wrap"><button class="btn" style="min-height:44px;padding:0 20px;font-size:14px" data-act="resume">Continue from there</button><button class="btn ghost" style="min-height:44px;padding:0 20px;font-size:14px" data-act="startover">Start from the beginning</button></div></div>';
  if(S.modal)o+='<div class="scrim" data-act="closemodal"><div class="modal" role="dialog" aria-modal="true" aria-labelledby="mh" data-stop="1"><h2 id="mh" style="font-size:22px;line-height:1.5">Welcome to Renuga Muthukumar Novels</h2><p class="muted" style="margin:0;font-size:15px">Log in to comment, rate, bookmark and highlight. Reading is always free.</p><button class="btn" data-act="dologin">Continue with Google</button><button class="btn ghost" data-act="dologin">Login with email</button><button style="min-height:44px;background:none;border:none;color:var(--muted);cursor:pointer;font-size:14px" data-act="closemodal">Not now</button><p class="muted" style="margin:0;font-size:12px;text-align:center">Prototype: either button signs you in as a sample reader.</p></div></div>';
  $('#overlay').innerHTML=o;
  document.documentElement.style.overflow=(S.menu||S.modal)?'hidden':'';
}

/* ---------- render ---------- */
function render(){
  var y=window.pageYOffset;
  var story=S.view==='story';
  $('#main').innerHTML=topHtml({story:story})+(S.view==='home'?homeHtml():story?storyHtml():S.view==='ongoing'?ongoingPage():S.view==='completed'?completedPage():accountHtml());
  $('#progHost').innerHTML='';
  drawTools();overlayHtml();
  if(S.keepScroll){window.scrollTo(0,y);S.keepScroll=false}
}
function rr(){S.keepScroll=true;render()}

/* ---------- events ---------- */
document.addEventListener('click',function(e){
  var t=e.target;
  if(t.closest&&t.closest('[data-stop]')&&!t.closest('button'))return;
  var el=t.closest?t.closest('[data-nav],[data-act],[data-story],[data-scroll],[data-sid],[data-tool],[data-hlc],[data-rate],[data-unhl],[data-reply],[data-tab],[data-tg],[data-unbm],[data-chap],[data-fill]'):null;
  if(!el){if(S.bell){S.bell=false;overlayHtml()}return}
  var d=el.dataset;
  if(el.tagName==='A')e.preventDefault();
  if(d.nav!==undefined){navTo(d.nav);return}
  if(d.story){S.bell=false;go('story');return}
  if(d.scroll){var x=document.getElementById(d.scroll);if(x)x.scrollIntoView({behavior:'smooth',block:'start'});return}
  if(d.tab){S.tab=d.tab;rr();return}
  if(d.tg){S[d.tg]=!S[d.tg];rr();return}
  if(d.unbm){S.removed[d.unbm]=true;rr();return}
  if(d.chap){if(d.chap!=='12')toast('Only Chapter 12 has sample text in this prototype.');return}
  if(d.fill){S.noteDraft=FILL[d.fill]||'';rr();var ta=$('#annc');if(ta)ta.focus();return}
  if(d.sid){if(S.loggedIn&&S.hlMode){if(S.hl[d.sid])delete S.hl[d.sid];else S.hl[d.sid]=S.hlColor;rr();bumpTools()}else if(!S.loggedIn){S.notice=true;S.toolsOn=true;drawTools()}return}
  if(d.unhl){delete S.hl[d.unhl];rr();return}
  if(d.hlc){S.hlColor=d.hlc;drawTools();bumpTools();return}
  if(d.rate){if(!S.loggedIn){S.notice=true;S.toolsOn=true;drawTools();return}S.rating=+d.rate;rr();return}
  if(d.reply){if(!S.loggedIn){S.notice=true;S.toolsOn=true;drawTools();return}S.replyTo=d.reply;S.replyName=d.rname;S.replyDraft='';
    // replies attach to the top-level thread
    S.threads.forEach(function(c){if(c.id===d.reply||c.rep.some(function(r){return r.id===d.reply}))S.replyTo=c.id});
    rr();var rb=$('#rbox');if(rb)rb.focus();return}
  if(d.tool){
    var k=d.tool;
    if(k==='smaller')S.sizeIdx=Math.max(0,S.sizeIdx-1);
    else if(k==='larger')S.sizeIdx=Math.min(SIZES.length-1,S.sizeIdx+1);
    else if(k==='mode'){S.mode=S.mode==='day'?'night':'day';document.documentElement.setAttribute('data-mode',S.mode)}
    else if(k==='bm'){if(!S.loggedIn){S.notice=true}else{S.bookmarked=!S.bookmarked;toast(S.bookmarked?'Bookmarked. Find it in My Account.':'Bookmark removed.')}}
    else if(k==='hl'){if(!S.loggedIn){S.notice=true}else S.hlMode=!S.hlMode}
    S.toolsOn=true;rr();bumpTools();return}
  var a=d.act;
  if(a==='menu'){S.menu=true;S.bell=false;overlayHtml();var mc=$('#menuClose');if(mc)mc.focus();return}
  if(a==='closemenu'){if(t.closest('.drawer')&&!t.closest('button'))return;S.menu=false;overlayHtml();focusMenuBtn();return}
  if(a==='back'){if(HIST.length>1){try{history.back()}catch(e){}setTimeout(function(){if(S.view==='story'){HIST.length=0;HIST.push('home');go('home',null,{pop:true})}},300)}else go('home');return}
  if(a==='trendmore'){S.trendAll=!S.trendAll;rr();return}
  if(a==='postnote'){var nv=(($('#annc')||{}).value||'').trim();if(!nv){toast('Write the update first.');return}S.notes.unshift({d:stamp(),text:nv,top:true});S.noteDraft='';rr();toast('Update published. It now shows in Latest Posts & Updates.');return}
  if(a==='login'){S.modal=true;S.pendingView=null;overlayHtml();return}
  if(a==='closemodal'){if(t.closest('.modal')&&!t.closest('button'))return;S.modal=false;overlayHtml();return}
  if(a==='dologin'){S.loggedIn=true;S.modal=false;var pv=S.pendingView;S.pendingView=null;S.notice=false;if(pv){go(pv)}else rr();toast('Signed in as Kavitha S (sample reader).');return}
  if(a==='logout'){S.loggedIn=false;S.hlMode=false;go('home');toast('You are logged out.');return}
  if(a==='account'){go('account');return}
  if(a==='bell'){S.bell=!S.bell;overlayHtml();return}
  if(a==='pushon'){S.push=!S.push;toast(S.push?'Notifications turned on.':'Notifications turned off.');rr();return}
  if(a==='closenotice'){S.notice=false;drawTools();return}
  if(a==='postcomment'){var v=($('#cbox')||{}).value||S.draft;v=(v||'').trim();if(!v)return;S.threads.unshift({id:'n'+Date.now(),n:'You',i:'Y',time:stamp(),text:v,rep:[]});S.draft='';rr();return}
  if(a==='postreply'){var rv=(($('#rbox')||{}).value||'').trim();if(!rv)return;S.threads.forEach(function(c){if(c.id===S.replyTo)c.rep.push({id:c.id+'r'+Date.now(),n:'You',i:'Y',time:stamp(),to:S.replyName,text:rv})});S.replyTo=null;S.replyDraft='';rr();return}
  if(a==='cancelreply'){S.replyTo=null;rr();return}
  if(a==='allchap'){toast('The full chapter list is a later screen.');return}
  if(a==='continue'){go('story',null,{resume:true});return}
  if(a==='resume'){S.resumeBar=false;S.trackOn=true;overlayHtml();jumpToPara(S.last.para);return}
  if(a==='startover'){S.resumeBar=false;S.trackOn=true;overlayHtml();return}
  if(a==='remind'){S.push=true;toast('Done. We will notify you when Chapter 13 is published.');rr();return}
  if(a==='save'){toast('Details saved.');return}
  if(a==='delacc'){toast('Account deletion is not active in the prototype.');return}
});
document.addEventListener('input',function(e){
  var t=e.target;
  if(t.id==='cbox')S.draft=t.value;
  else if(t.id==='rbox')S.replyDraft=t.value;
  else if(t.id==='annc')S.noteDraft=t.value;
  else if(t.id==='q'){S.q=t.value.trim();var tl=$('#trendList');if(tl)tl.innerHTML=trendingHtml(S.q);var ol=$('#ongoingList');if(ol)ol.innerHTML=ongoingHtml(S.q,S.view==='home'?1:99,S.view==='home');var cl=$('#completedList');if(cl)cl.innerHTML=completedHtml(S.q,S.view==='home'?1:99)}
});
/* Copy protection: blocks selection, right-click, drag, copy and common shortcuts on story text. It deters casual copying only. */
var lastWarn=0;
function warn(){var n=Date.now();if(n-lastWarn>2500){lastWarn=n;toast('This story is protected. Please do not copy it.')}}
function guarded(t){var n=t&&t.nodeType===3?t.parentNode:t;return !!(n&&n.closest&&n.closest('.nocopy'))}
['contextmenu','dragstart','selectstart'].forEach(function(ev){document.addEventListener(ev,function(e){if(guarded(e.target)){e.preventDefault();if(ev==='contextmenu')warn()}})});
['copy','cut'].forEach(function(ev){document.addEventListener(ev,function(e){var a=document.activeElement;if(a&&(a.tagName==='TEXTAREA'||a.tagName==='INPUT'))return;if(S.view==='story'){e.preventDefault();warn()}})});
document.addEventListener('keydown',function(e){if(S.view!=='story')return;var a=document.activeElement;if(a&&(a.tagName==='TEXTAREA'||a.tagName==='INPUT'))return;if((e.ctrlKey||e.metaKey)&&['c','a','s','p'].indexOf((e.key||'').toLowerCase())>-1){e.preventDefault();warn()}});
document.addEventListener('keydown',function(e){
  if(e.key==='Escape'&&(S.modal||S.bell||S.menu)){var wm=S.menu;S.modal=false;S.bell=false;S.menu=false;overlayHtml();if(wm)focusMenuBtn()}
  if(e.key==='Tab'&&S.menu){var f=[].slice.call(document.querySelectorAll('.drawer button'));if(!f.length)return;var a0=f[0],a1=f[f.length-1];if(e.shiftKey&&document.activeElement===a0){e.preventDefault();a1.focus()}else if(!e.shiftKey&&document.activeElement===a1){e.preventDefault();a0.focus()}}
});
window.addEventListener('scroll',function(){
  if(S.view!=='story')return;
  var d=document.documentElement,max=d.scrollHeight-window.innerHeight;
  var p=max>0?Math.min(100,Math.max(0,Math.round(window.pageYOffset/max*100))):0;
  if(S.trackOn){clearTimeout(trackT);trackT=setTimeout(trackPos,350)}else if(S.resumeBar&&window.pageYOffset>700&&Date.now()-S.enterAt>1200){S.resumeBar=false;S.trackOn=true;overlayHtml()}
  if(p!==S.progress){S.progress=p;var b=$('#pbar');if(b)b.style.width=p+'%';var mp=$('#mprog');if(mp)mp.textContent='Chapter 12 · '+p+'% read'}
  bumpTools();
},{passive:true});
/* reading the chapter on a tap also wakes the toolbar */
document.addEventListener('click',function(e){if(S.view==='story'&&e.target.closest&&e.target.closest('#chapter'))bumpTools()});

/* start */
var h=hashView();
if(h==='account'){S.loggedIn=true}
S.view=h;HIST=[h];
window.addEventListener('hashchange',function(){
  var v=hashView();if(v===S.view)return;
  if(HIST.length>1&&HIST[HIST.length-2]===v)HIST.pop();else HIST.push(v);
  go(v,null,{pop:true});
});
render();
if(S.view==='story')bumpTools();
})();
</script>
